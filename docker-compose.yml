services:
  tienda:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Madrid
      - DB_PATH=/data/tienda.db
      - API_KEY=${API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - SEED=${SEED:-1}
    volumes:
      - tienda_data:/data

  # One-shot: importa y activa los flujos de workflows/ en n8n en cada arranque.
  # n8n no arranca hasta que este servicio termina con exito.
  n8n-import:
    image: docker.n8n.io/n8nio/n8n
    entrypoint: >
      sh -c "for f in /workflows/*.json; do
               echo Importando $$f;
               n8n import:workflow --input=\"$$f\" || exit 1;
             done &&
             n8n export:workflow --all --output=/tmp/export.json &&
             node /activate.mjs"
    volumes:
      - ./workflows:/workflows:ro
      - ./scripts/n8n-activate.mjs:/activate.mjs:ro
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid

  n8n:
    image: docker.n8n.io/n8nio/n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Madrid
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n

  # Buzón de pruebas: recoge todos los correos que envía n8n y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  tienda_data:
  n8n_data:
