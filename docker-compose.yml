services:
  tienda:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Madrid
      - DB_PATH=/data/tienda.db
      - API_KEY=${API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - SEED=${SEED:-1}
    volumes:
      - tienda_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Madrid
      - GENERIC_TIMEZONE=Europe/Madrid
      - API_KEY=${API_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

  # Buzón de pruebas: recoge todos los correos que envía n8n y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  tienda_data:
  n8n_data:
