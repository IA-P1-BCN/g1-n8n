version: "3"

vars:
  IMAGEN_N8N: docker.n8n.io/n8nio/n8n
  VOLUMEN_N8N: paso-firme_n8n_data  # volumen de datos de n8n; cámbialo si renombras la carpeta del proyecto

tasks:
  test:
    desc: "Ejecuta las suites e2e de tests/ contra el stack local (solo una: task test -- us-05)"
    cmds:
      - python scripts/ejecutar-tests.py {{.CLI_ARGS}}

  importar:
    desc: "Importa credentials/ y workflows/ en n8n y activa los flujos (para n8n durante el proceso; lánzalo tras editar JSONs o al levantar el stack)"
    cmds:
      - python scripts/n8n-importar.py

  default:
    cmds:
      - task --list
    silent: true
