version: "3"

vars:
  IMAGEN_N8N: docker.n8n.io/n8nio/n8n
  VOLUMEN_N8N: paso-firme_n8n_data  # volumen de datos de n8n; cámbialo si renombras la carpeta del proyecto

tasks:
  install:
    desc: "Configuración inicial: copia .env.example a .env (si aún no existe, no lo sobreescribe)"
    cmds:
      - cmd: python -c "import os, shutil; shutil.copyfile('.env.example', '.env') if not os.path.exists('.env') else print('.env ya existe, no lo toco')"

  arrancar:
    desc: "Levanta el stack local (tienda, n8n y mailpit); la primera vez sigue con task importar"
    cmds:
      - docker compose up -d

  test:
    desc: "Ejecuta las suites e2e de tests/ contra el stack local (solo una: task test -- us-05)"
    cmds:
      - python scripts/ejecutar-tests.py {{.CLI_ARGS}}

  payload:
    desc: "Envia a n8n el payload de un fichero JSON (task payload -- payloads/venta-registrada.json)"
    cmds:
      - python -u scripts/enviar-payload.py {{.CLI_ARGS}}

  importar:
    desc: "Importa credentials/ y workflows/ en n8n y activa los flujos (para n8n durante el proceso; lánzalo tras editar JSONs o al levantar el stack)"
    cmds:
      - python -u scripts/n8n-importar.py

  default:
    cmds:
      - task --list
    silent: true
